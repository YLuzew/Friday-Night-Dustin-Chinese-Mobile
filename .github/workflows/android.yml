name: Android Build
on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          key: cache-build-android-${{ github.run_id }}
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            C:/hostedtoolcache/windows/haxe/4.3.6/x64/lib/
            ~/.haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android-none

      - name: Installing/Updating libraries
        run: |
          rm -rf .haxelib
          mkdir -p .haxelib
          haxelib setup || true

          # 重试安装函数（超时 600s，最多重试 5 次）
          retry_install() {
            local lib="$1"
            local version="$2"
            local timeout_sec=600
            local max_attempts=5
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt/$max_attempts: installing $lib${version:+ }$version (timeout ${timeout_sec}s)"
              if timeout $timeout_sec haxelib install --always "$lib" $version; then
                echo "✅ Successfully installed $lib"
                return 0
              fi
              echo "❌ Installation of $lib failed or timed out, retrying in 30s..."
              sleep 30
              attempt=$((attempt+1))
            done
            echo "⚠️ Failed to install $lib after $max_attempts attempts."
            return 1
          }

          # 1. 安装核心库（hxcpp、openfl、hxandroid、hxjava）
          echo "=== Installing required core libraries ==="
          retry_install hxcpp
          retry_install openfl
          retry_install hxandroid
          retry_install hxjava

          # 2. 安装 lime（尝试多个版本，并备选 git 克隆）
          echo "=== Installing lime ==="
          if ! retry_install lime 7.9.0; then
            echo "lime 7.9.0 failed, trying 8.2.1..."
            if ! retry_install lime 8.2.1; then
              echo "Both versioned lime installations failed. Cloning from git as last resort..."
              if haxelib git lime https://github.com/openfl/lime; then
                echo "✅ lime installed from git"
              else
                echo "❌ All lime installation methods failed. Exiting."
                exit 1
              fi
            fi
          fi

          # 3. hxvlc 可选
          echo "=== Installing hxvlc (optional) ==="
          haxelib install hxvlc || echo "hxvlc skipped (not critical)."

          # 4. 运行项目自定义设置（可能安装 flixel 等）
          echo "=== Running project setup script ==="
          haxe -cp commandline -D analyzer-optimize --run Main setup -s || echo "Setup script finished."

          # 5. 调试信息
          echo "=== Installed haxelibs ==="
          haxelib list
          haxelib path hxcpp || echo "hxcpp not found!"
          haxelib path lime || echo "lime not found!"

      - name: Patch hscript bug
        run: |
          find . -name "Interp.hx" -path "*/hscript/*" -exec sed -i 's/return Config\.IMPORT_BLACKLIST;/return [];/g' {} \;
          find . -name "Interp.hx" -path "*/hscript/*" -exec sed -i 's/return Config\.importBlacklist;/return [];/g' {} \;

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Fix Haxelib (optional - use git versions)
        run: |
          haxelib set flixel git
          haxelib set flixel-addons git
          haxelib set flixel-animate git
          haxelib set hxdiscord_rpc git

      - name: Building the game
        run: |
          haxelib run lime build android -final -D ONLY_ARM64

      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dustin Android
          path: export/release/android/bin/app/build/outputs/apk/*

      - name: Clear Previous Cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-android") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }

      - name: Upload New Cache
        uses: actions/cache@v4
        with:
          key: cache-build-android
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            C:/hostedtoolcache/windows/haxe/4.3.6/x64/lib/
            ~/.haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android-none