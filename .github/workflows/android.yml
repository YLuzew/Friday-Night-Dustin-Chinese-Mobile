name: Android Build
on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r21e

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          key: cache-build-android-${{ github.run_id }}
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            ~/.haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android-none

      - name: Configure Git auth for private haxelibs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        if: env.GH_PAT != ''
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/HomuHomu833-haxelibs/".insteadOf "https://github.com/HomuHomu833-haxelibs/"

      - name: Install CNE custom dependencies
        run: |
          rm -rf .haxelib
          mkdir -p .haxelib
          haxelib setup .haxelib || true

          retry_git() {
            local lib="$1"
            local url="$2"
            local ref="$3"
            for i in {1..3}; do
              if [ -n "$ref" ]; then
                haxelib git "$lib" "$url" "$ref" && return 0
              else
                haxelib git "$lib" "$url" && return 0
              fi
              sleep 10
            done
            echo "Failed to install $lib"
            exit 1
          }

          echo "=== Core libraries ==="
          retry_git hxcpp https://github.com/th2l-devs/hxcpp
          haxelib install openfl 9.2.2 --always

          echo "=== Custom Lime (Ajwyunsx fork) ==="
          retry_git lime https://github.com/Ajwyunsx/lime

          echo "=== CNE flixel stack ==="
          retry_git flixel https://github.com/CodenameCrew/cne-flixel
          retry_git flixel-addons https://github.com/CodenameCrew/cne-flixel-addons
          retry_git flxanimate https://github.com/CodenameCrew/cne-flxanimate
          retry_git hscript-improved https://github.com/CodenameCrew/hscript-improved custom-classes

          echo "=== Extra extensions ==="
          haxelib install hxjava --always
          haxelib install hxvlc 1.9.3 --always --skip-deps || true
          haxelib install hxdiscord_rpc --always || true

          echo "=== Run project setup ==="
          haxe -cp commandline -D analyzer-optimize --run Main setup -s || echo "Setup finished."

          echo "=== Installed haxelibs ==="
          haxelib list

      - name: Patch hscript bug
        run: |
          find . -name "Interp.hx" -path "*/hscript*" -exec sed -i 's/return Config\.IMPORT_BLACKLIST;/return [];/g' {} \;
          find . -name "Interp.hx" -path "*/hscript*" -exec sed -i 's/return Config\.importBlacklist;/return [];/g' {} \;

      - name: Add missing Android extern classes
        run: |
          mkdir -p source/android/os source/android/content

          cat > source/android/os/Build.hx << 'EOF'
          package android.os;
          extern class Build {
            public static var MODEL:String;
            public static var MANUFACTURER:String;
            public static var PRODUCT:String;
            public static var DEVICE:String;
            public static var VERSION:Version;
          }
          extern class Version {
            public static var SDK_INT:Int;
            public static var RELEASE:String;
            public static var CODENAME:String;
          }
          EOF

          cat > source/android/os/Environment.hx << 'EOF'
          package android.os;
          extern class Environment {
            public static var MEDIA_MOUNTED:String;
            public static var MEDIA_UNMOUNTED:String;
            public static function getExternalStorageDirectory():String;
            public static function getExternalStorageState():String;
          }
          EOF

          cat > source/android/content/Context.hx << 'EOF'
          package android.content;
          extern class Context {
            public function getExternalFilesDir(type:String):String;
            public function getFilesDir():String;
            public function getPackageName():String;
            public function getContentResolver():ContentResolver;
          }
          extern class ContentResolver {}
          EOF

          cat > source/android/Settings.hx << 'EOF'
          package android;
          extern class Settings {
            public static var System:SystemSettings;
          }
          extern class SystemSettings {
            public static var SCREEN_BRIGHTNESS:String;
            public static var SCREEN_OFF_TIMEOUT:String;
          }
          EOF

          cat > source/android/Permissions.hx << 'EOF'
          package android;
          extern class Permissions {
            public static var READ_EXTERNAL_STORAGE:String;
            public static var WRITE_EXTERNAL_STORAGE:String;
            public static var CAMERA:String;
            public static var RECORD_AUDIO:String;
            public static var INTERNET:String;
          }
          EOF

      - name: Configure Android build environment
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Build Android APK
        run: |
          haxelib run lime build android -final -D ONLY_ARM64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dustin Android
          path: export/release/android/bin/app/build/outputs/apk/*

      - name: Clear previous cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key.startsWith("cache-build-android")) {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
              }
            }

      - name: Upload new cache
        uses: actions/cache@v4
        with:
          key: cache-build-android
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            ~/.haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android-none
