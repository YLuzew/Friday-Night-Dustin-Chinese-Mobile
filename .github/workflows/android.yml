name: Android Build
on:
  push:
    branches: ['main']
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    name: Android Build
    permissions: write-all
    runs-on: macos-15
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: Restore existing build cache
        uses: actions/cache@v4
        with:
          key: cache-build-android
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android
      - name: Clean and install all dependencies
        run: |
          # 强制清除旧 haxelib 缓存，避免损坏文件干扰
          rm -rf .haxelib
          mkdir -p .haxelib

          # 项目自带设置脚本（可能安装部分库）
          haxe -cp commandline -D analyzer-optimize --run Main setup -s || echo "Setup script finished"

          # 重试函数（最多5次，间隔10秒）
          retry() {
            local max=5
            local count=1
            while [ $count -le $max ]; do
              echo "Attempt $count/$max: $*"
              if "$@"; then
                echo "Success!"
                return 0
              fi
              echo "Failed, retrying in 10s..."
              sleep 10
              count=$((count+1))
            done
            echo "All attempts failed."
            return 1
          }

          # 安装必需库（不指定版本，让 haxelib 自动选择最新稳定版）
          retry haxelib install hxcpp
          retry haxelib install lime
          retry haxelib install openfl
          retry haxelib install flixel
          retry haxelib install flixel-addons
          retry haxelib install flxanimate
          retry haxelib install hxjava
          retry haxelib install hxandroid
          retry haxelib install hxvlc   # 可选，项目需要

          # 调试：列出所有已安装库
          haxelib list
      - name: Configuring Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_21_arm64
          haxelib run lime config ANDROID_SETUP true
      - name: Building the game
        run: haxelib run lime build android -final -verbose
      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dustin Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
      - name: Clearing already existing cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-android") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }
      - name: Uploading new cache
        uses: actions/cache@v4
        with:
          key: cache-build-android
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android