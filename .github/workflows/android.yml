name: Android Build
on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          key: cache-build-android-${{ github.run_id }}
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            C:/hostedtoolcache/windows/haxe/4.3.6/x64/lib/
            ~/.haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android-none

      - name: Installing/Updating libraries
        run: |
          # 清除旧目录，确保纯净
          rm -rf .haxelib
          mkdir -p .haxelib
          haxelib setup || true

          # 重试安装函数（最多5次）
          retry_install() {
            local max=5
            local count=1
            while [ $count -le $max ]; do
              echo "Attempt $count/$max: haxelib install $1"
              if haxelib install --always "$1"; then
                echo "Successfully installed $1"
                return 0
              fi
              echo "Failed, retrying in 10s..."
              sleep 10
              count=$((count+1))
            done
            echo "Failed after $max attempts"
            return 1
          }

          # 必须安装的核心库
          retry_install hxcpp 4.3.1
          retry_install lime          # 使用最新稳定版
          retry_install openfl
          retry_install hxandroid     # Android Java 绑定
          retry_install hxjava        # Java 核心绑定

          # hxvlc 为可选，安装失败不影响构建
          echo "Installing hxvlc (optional)..."
          haxelib install hxvlc || echo "hxvlc installation skipped (not critical)."

          # 运行项目自定义设置（可能会安装 flixel 等）
          haxe -cp commandline -D analyzer-optimize --run Main setup -s || echo "Setup script finished"

          # 调试信息
          haxelib list
          haxelib path hxcpp || echo "hxcpp not found!"

      - name: Patch hscript bug
        run: |
          find . -name "Interp.hx" -path "*/hscript/*" -exec sed -i 's/return Config\.IMPORT_BLACKLIST;/return [];/g' {} \;
          find . -name "Interp.hx" -path "*/hscript/*" -exec sed -i 's/return Config\.importBlacklist;/return [];/g' {} \;

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Fix Haxelib (optional - use git versions for some libs)
        run: |
          haxelib set flixel git
          haxelib set flixel-addons git
          haxelib set flixel-animate git
          haxelib set hxdiscord_rpc git

      - name: Building the game
        run: |
          haxelib run lime build android -final -D ONLY_ARM64

      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dustin Android
          path: export/release/android/bin/app/build/outputs/apk/*

      - name: Clear Previous Cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-android") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }

      - name: Upload New Cache
        uses: actions/cache@v4
        with:
          key: cache-build-android
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            C:/hostedtoolcache/windows/haxe/4.3.6/x64/lib/
            ~/.haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android-none