name: iOS Build
on:
  workflow_dispatch:
  workflow_call:
env:
  PROJECT_NAME: dustin
jobs:
  build:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Restore Previous Cache
        uses: actions/cache@v4
        with:
          key: cache-build-ios-${{ github.run_id }}
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            C:/hostedtoolcache/windows/haxe/4.3.6/x64/lib/
            ~/.haxelib/
            export/release/ios/${{ env.PROJECT_NAME }}/haxe/
            export/release/ios/${{ env.PROJECT_NAME }}/obj/
          restore-keys: |
            cache-build-ios-none

      - name: Installing/Updating libraries
        run: |
          rm -rf .haxelib
          mkdir -p .haxelib
          haxelib setup || true

          retry_install() {
            local max=5
            local count=1
            while [ $count -le $max ]; do
              echo "Attempt $count/$max: haxelib install $1"
              if haxelib install --always "$1"; then
                echo "Successfully installed $1"
                return 0
              fi
              echo "Failed, retrying in 10s..."
              sleep 10
              count=$((count+1))
            done
            echo "Failed after $max attempts"
            return 1
          }

          # 安装 hxcpp 和 hxvlc
          retry_install hxcpp 4.3.1
          retry_install hxvlc
          # 使用 lime 7.9.0（兼容 flex1）
          retry_install lime 7.9.0
          # 安装其他依赖
          retry_install openfl
          retry_install flixel
          retry_install flixel-addons
          retry_install flxanimate

          haxe -cp commandline -D analyzer-optimize --run Main setup -s || echo "Setup script finished"

          haxelib list
          haxelib path hxcpp || echo "hxcpp not found!"

      - name: Fix Haxelib (optional)
        run: |
          # 不切换 lime 到 git，保留固定版本
          haxelib set flixel git
          haxelib set flixel-addons git
          haxelib set flixel-animate git
          haxelib set hxdiscord_rpc git

      - name: Building the game
        run: |
          haxelib run lime build ios -nosign -final
          # 这真的很诡异，你们知道吗
          # 我已急哭

      - name: Make Ipa
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dustin iOS
          path: export/release/ios/build/Release-iphoneos/*.ipa

      - name: Clear Previous Cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-ios") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }

      - name: Upload New Cache
        uses: actions/cache@v4
        with:
          key: cache-build-ios
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            C:/hostedtoolcache/windows/haxe/4.3.6/x64/lib/
            ~/.haxelib/
            export/release/ios/${{ env.PROJECT_NAME }}/haxe/
            export/release/ios/${{ env.PROJECT_NAME }}/obj/
          restore-keys: |
            cache-build-ios-none