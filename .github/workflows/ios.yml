name: iOS Build
on:
  workflow_dispatch:
  workflow_call:
env:
  PROJECT_NAME: dustin   # 请确认与您的项目输出目录一致
jobs:
  build:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Restore Previous Cache
        uses: actions/cache@v4
        with:
          key: cache-build-ios-${{ github.run_id }}
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            C:/hostedtoolcache/windows/haxe/4.3.6/x64/lib/
            ~/.haxelib/
            export/release/ios/${{ env.PROJECT_NAME }}/haxe/
            export/release/ios/${{ env.PROJECT_NAME }}/obj/
          restore-keys: |
            cache-build-ios-

      - name: Installing/Updating libraries
        run: |
          # 显式安装核心库
          haxelib install hxcpp 4.3.1
          haxelib install lime 8.2.1
          haxelib install openfl 9.3.0
          haxelib install flixel 5.6.1
          haxelib install flixel-addons 3.2.2
          haxelib install flxanimate
          haxelib install hxvlc
          # 运行项目设置
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      - name: Fix Haxelib
        run: |
          haxelib set lime git
          haxelib set hxcpp git
          haxelib set flixel git
          haxelib set flixel-addons git
          haxelib set flixel-animate git
          haxelib set hxdiscord_rpc git

      - name: Building the game
        run: |
          haxelib run lime build ios -nosign -final

      - name: Make Ipa
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Dustin iOS
          path: export/release/ios/build/Release-iphoneos/*.ipa

      - name: Clear Previous Cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-ios") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }

      - name: Upload New Cache
        uses: actions/cache@v4
        with:
          key: cache-build-ios
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            C:/hostedtoolcache/windows/haxe/4.3.6/x64/lib/
            ~/.haxelib/
            export/release/ios/${{ env.PROJECT_NAME }}/haxe/
            export/release/ios/${{ env.PROJECT_NAME }}/obj/
          restore-keys: |
            cache-build-ios