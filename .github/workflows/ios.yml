name: iOS Build
on:
  workflow_dispatch:
  workflow_call:
env:
  PROJECT_NAME: Friday-Night-Dustin-Chinese
jobs:
  build:
    name: iOS Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@master
        with:
          xcode-version: '16.4'

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          key: cache-build-ios-${{ github.run_id }}
          path: |
            .haxelib/
            /Users/runner/haxelib/
            export/release/ios/${{ env.PROJECT_NAME }}/haxe/
            export/release/ios/${{ env.PROJECT_NAME }}/obj/
          restore-keys: |
            cache-build-ios-

      - name: Installing/Updating libraries
        run: |
          haxelib install hscript 2.5.0
          haxelib install hxvlc
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp --depth 1
          haxelib git lime https://github.com/openfl/lime --depth 1
          haxelib git openfl https://github.com/openfl/openfl --depth 1
          haxelib git flixel https://github.com/HaxeFlixel/flixel --depth 1
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      - name: Building the game
        run: |
          haxelib run lime build ios -nosign -final

      - name: Make Ipa
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir -p Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: Friday-Night-Dustin-Chinese-iOS
          path: export/release/ios/build/Release-iphoneos/*.ipa

      - name: Clear Previous Cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-ios") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }

      - name: Upload New Cache
        uses: actions/cache@v4
        with:
          key: cache-build-ios
          path: |
            .haxelib/
            /Users/runner/haxelib/
            export/release/ios/${{ env.PROJECT_NAME }}/haxe/
            export/release/ios/${{ env.PROJECT_NAME }}/obj/
          restore-keys: |
            cache-build-ios