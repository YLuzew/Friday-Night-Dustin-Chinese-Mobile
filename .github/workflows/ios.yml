name: iOS Build
on:
  push:
    branches: ['main']
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    name: iOS Build
    permissions: write-all
    runs-on: macos-15
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@master
        with:
          xcode-version: '16.4'
      - name: Restore existing build cache
        uses: actions/cache@v4
        with:
          key: cache-build-ios
          path: |
            .haxelib/
            export/release/ios/dustin/haxe/
          restore-keys: |
            cache-build-ios
      - name: Installing all dependencies (with retry)
        run: |
          # 项目自带脚本
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

          retry() {
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt/$max_attempts: $@"
              if "$@"; then
                echo "Success!"
                return 0
              fi
              echo "Failed, retrying in 5s..."
              sleep 5
              attempt=$((attempt+1))
            done
            echo "All attempts failed."
            return 1
          }

          # 安装核心库
          retry haxelib install hxcpp
          retry haxelib install lime 8.2.1
          retry haxelib install openfl
          retry haxelib install flixel 5.6.1
          retry haxelib install flixel-addons 3.2.2
          retry haxelib install flxanimate
          retry haxelib install hxvlc  # 如果项目需要

          # 更新所有库
          haxelib upgrade

          haxelib list
      - name: Building the game
        run: haxelib run lime build ios -eval -nosign -final
      - name: Clearing already existing cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-ios") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }
      - name: Making ipa file
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/dustin.app
          ldid -S../../../dustin/dustin.entitlements dustin
          cd ..
          mkdir Payload
          mv dustin.app Payload
          zip -r dustin.ipa Payload
      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dustin iOS
          path: export/release/ios/build/Release-iphoneos/*.ipa
      - name: Uploading new cache
        uses: actions/cache@v4
        with:
          key: cache-build-ios
          path: |
            .haxelib/
            export/release/ios/dustin/haxe/
          restore-keys: |
            cache-build-ios